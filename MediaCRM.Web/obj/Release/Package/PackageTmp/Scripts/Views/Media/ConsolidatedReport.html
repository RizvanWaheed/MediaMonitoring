<div class="wrapper">
    <div ui-view="Header"></div>
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper" style="min-height:650px !important;" ng-app="CRMApp" id="ConsolidatedReportController" ng-controller="ConsolidatedReportController">
        <!-- header starts here -->
        <div class="container-fluid page_name">
            <div class="col-sm-10"><i class="fa fa-flag"></i> Media Reports</div>
        </div>
        <!-- header ends here -->
        <div class="container-fluid padding_set">
            <div class="col-md-12">
                <div class="box box-default">
                    <div class="box-header with-border">
                        <div class="col-sm-2 zro"><i class="fa fa-bullhorn"></i> REPORTS</div>
                        <div class="col-md-8 zro">
                            <div class="col-md-4 zro_left">
                                <div id="multisel">
                                    <div class='sel_menu' ng-dropdown-multiselect1="" options="ShiftTypeList"
                                         selected-model="SelectedShift" checkboxes="true" translation-texts="example5customTexts"
                                         extra-settings="groupsettings">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-1">
                                <button type="button" class="btn btn-primary button_round  btn_height3" 
                                        ng-click="GenerateReport()" style="float:left !important;">Generate</button>
                            </div>

                        </div>
                        <div class="col-sm-2">
                            <div class="" style=" float:right;" role="group" aria-label="...">
                                <button type="button" class="btn btn-pdfcell btn-sm" title="EXPORT PDF" ng-click="ConvertPDF(false)"><i class="fa fa-cloud-upload"></i></button>
                                <button style="display:none;" type="button" class="btn btn-mailrec btn-sm" title="EMAIL PDF" ng-click="ConvertPDF(true)"><i class="fa fa-envelope"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="box-body">
                        <div class="box-body no-padding">
                            <div class="logohead">
                                <img src="/Content/images/reportlogo.png" alt="logo">
                                <h4>
                                    PPIC3, LAHORE  DAILY SITUATION REPORT {{ReportDate  | date:'dd-MM-yyyy' }}, HIGHLIGHTS
                                </h4>
                            </div>
                            <div id="subWiseCat" class="itembox" ng-repeat="cat in subWiseCat">
                                <h4>{{cat.CatName}}</h4>
                                <ul class="linklist" ng-repeat="subject in cat.Data">
                                    <li>
                                        <a href="">{{subject.Data}} </a>
                                    </li>
                                </ul>
                            </div>
                            <h3>Brief Description of News</h3>
                            <div ng-repeat="cat in descWiseCat">
                                <h3 class="smhead"><a href="">{{cat.CatName}}</a></h3>
                                <ul class="deslist" ng-repeat="desc in cat.Data">
                                    <li>
                                        <strong>[{{desc.Source}}, {{desc.NewsDate}}]</strong>{{desc.Data}}
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div><!-- /.box-body -->
            </div><!-- /.box -->
        </div>
    </div>
</div>
<!-- Main content -->
<div ui-view="Footer"></div>
